[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emimind"
version = "0.1.0"
description = "Context-aware AI research platform for the Indonesian Stock Exchange (IDX)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.1",
    "python-multipart>=0.0.9",
    "minio>=7.2",
    "redis>=5.0",
    "arq>=0.26",
    "httpx>=0.27",
    "anthropic>=0.39",
    "openai>=1.40",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "pytesseract>=0.3",
    "pillow>=10.0",
    "camelot-py[base]>=0.11",
    "arelle-release>=2.28",
    "rapidfuzz>=3.9",
    "polars>=1.0",
    "tiktoken>=0.7",
    "python-slugify>=8.0",
    "mcp>=2.1.1",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["services", "eval", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501", "UP042", "B008", "C408", "PLR0911", "PLR0912", "PLR0915", "PLR0917", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
