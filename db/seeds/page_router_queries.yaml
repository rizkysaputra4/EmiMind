# Seed query dictionary for page router (M9 Phase 3).
# Keyed by module name, then sector ('ALL' default, overridable per sector).
# Fields:
#   terms_id: Indonesian search terms (FTS leg + bge-m3 query text)
#   terms_en: English search terms (FTS leg + bge-m3 query text)
#   max_pages: TOTAL page budget for the module across all returned spans. Default 6
#              (services/mcp/types.py RouteQuery). Override only with a stated reason.
#   anchor_patterns: note-heading / statement-title regexes. They form the third ranked
#              list of the RRF (pages whose heading matches), never the sole mechanism.

BALANCE_SHEET:
  ALL:
    terms_id:
      - "laporan posisi keuangan"
      - "laporan posisi keuangan konsolidasian"
      - "aset lancar"
      - "jumlah aset"
      - "liabilitas"
      - "ekuitas"
    terms_en:
      - "statement of financial position"
      - "financial position"
      - "current assets"
      - "total assets"
      - "liabilities"
      - "equity"
    max_pages: 6
    anchor_patterns:
      - "LAPORAN POSISI KEUANGAN"
      - "STATEMENT OF FINANCIAL POSITION"
  BANK:
    terms_id:
      - "laporan posisi keuangan"
      - "laporan posisi keuangan konsolidasian"
      - "jumlah aset"
      - "liabilitas"
      - "ekuitas"
    terms_en:
      - "statement of financial position"
      - "financial position"
      - "total assets"
      - "liabilities"
      - "equity"
    # bank balance sheets run 4-7 pages (assets, liabilities, temporary syirkah funds, equity)
    max_pages: 8
    anchor_patterns:
      - "LAPORAN POSISI KEUANGAN"
      - "STATEMENT OF FINANCIAL POSITION"

