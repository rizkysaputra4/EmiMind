# Cross-statement tie-out rules
# When both concepts are submitted (unsegmented, any `statement` label), their values must agree
# within max(1 unit of the contract scale, 0.1%). A mismatch is an ERROR `TIE_OUT` with the hint
# "check you used the current-period column".
#
# Rules compare two DIFFERENT concepts. The same concept submitted twice (e.g. a note total and
# the balance-sheet line, both as idx:LoansGross) is one fact identity and is rejected as
# DUPLICATE_FACT, so same-concept rules are not needed.
#
# Removed 2026-09: "Cash in banks note -> Cash and cash equivalents". Cash in banks is only one
# component of C&CE (cash on hand and time deposits are the others), so the two never tie.
rules:
  - id: "loans_note_to_bs"
    name: "Loans note total to balance-sheet loans (gross)"
    source_concept: "idx:LoansGross"
    source_statement: "NOTE"
    target_concept: "idx:LoansAndAdvances"
    target_statement: "BS"
    description: "Gross loans in the loans note must equal balance-sheet Loans and Advances (gross)."

  - id: "bs_cash_to_cf_ending_cash"
    name: "Balance-sheet cash and cash equivalents to cash-flow ending cash"
    source_concept: "ifrs:CashAndCashEquivalents"
    source_statement: "BS"
    target_concept: "idx:CashAtEndOfPeriod"
    target_statement: "CF"
    description: >-
      Cash and cash equivalents on the statement of financial position must equal cash and cash
      equivalents at the end of the period in the statement of cash flows. If the cash-flow figure
      is net of bank overdrafts, do not submit it as idx:CashAtEndOfPeriod.
