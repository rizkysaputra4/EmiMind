[mypy]
python_version = 3.12
strict = True
warn_unused_ignores = True
warn_redundant_casts = True
disallow_untyped_decorators = False
plugins = pydantic.mypy
# Throwaway review/probe scripts (M9 remediation evidence), not product code.
exclude = ^eval/review_tools/

[mypy-camelot.*]
ignore_missing_imports = True
ignore_errors = True

[mypy-yfinance.*]
ignore_missing_imports = True

[mypy-pdfplumber.*]
ignore_missing_imports = True

[mypy-pytesseract.*]
ignore_missing_imports = True

[mypy-arelle.*]
ignore_missing_imports = True

[mypy-tiktoken.*]
ignore_missing_imports = True

[mypy-pymupdf.*]
ignore_missing_imports = True

[mypy-sentence_transformers.*]
ignore_missing_imports = True

[mypy-FlagEmbedding.*]
ignore_missing_imports = True

[mypy-services.extraction.ocr]
disallow_untyped_calls = False

[mypy-tests.generate_fixtures]
disallow_untyped_calls = False
