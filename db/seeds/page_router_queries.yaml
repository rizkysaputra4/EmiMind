    # planted hectares (mature / immature) sit in the bearer-plants note, the plasma note, a
    # plantation-area note, or the general-information note; the biological-assets note
    # (growing produce at fair value) is BIOLOGICAL_ASSETS_DETAIL and is not anchored here
    terms_id:
      - "tanaman menghasilkan"
      - "tanaman belum menghasilkan"
      - "tanaman produktif"
      - "luas areal"
      - "luas area tanaman"
      - "area perkebunan"
      - "perkebunan plasma"
      - "hektar"
    terms_en:
      - "mature plantations"
      - "immature plantations"
      - "bearer plants"
      - "total area of bearer plants"
      - "planted area"
      - "plantation area"
      - "plasma plantations"
      - "hectares"
    max_pages: 6
    anchor_patterns:
      - "TANAMAN PRODUKTIF"
      - "TANAMAN PERKEBUNAN"
      - "BEARER PLANTS"
      - "AREA PERKEBUNAN"
      - "PLANTATION AREA"
      - "LUAS AREAL?"
