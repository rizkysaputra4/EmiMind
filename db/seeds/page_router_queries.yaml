# Seed query dictionary for page router (M9 Phase 3).
# Keyed by module name, then sector ('ALL' default, overridable per sector).
# Fields:
#   terms_id: Indonesian search terms for FTS / semantic matching
#   terms_en: English search terms for FTS / semantic matching
#   max_pages: maximum page span to retrieve
#   anchor_patterns: note-heading regexes used as FTS anchors

BALANCE_SHEET:
  ALL:
    terms_id:
      - "laporan posisi keuangan konsolidasian"
      - "aset lancar"
      - "liabilitas"
      - "ekuitas"
    terms_en:
      - "statement of financial position"
      - "current assets"
      - "liabilities"
      - "equity"
    max_pages: 4
    anchor_patterns:
      - "LAPORAN POSISI KEUANGAN"
      - "STATEMENT OF FINANCIAL POSITION"

INCOME_STATEMENT:
  ALL:
    terms_id:
      - "laporan laba rugi dan penghasilan komprehensif lain"
