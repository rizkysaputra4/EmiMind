    anchor_patterns:
      - "PINJAMAN YANG DITERIMA"
      - "EFEK(-EFEK| UTANG)? YANG DITERBITKAN"
      - "SURAT BERHARGA YANG DITERBITKAN"
      - "BORROWINGS"
      - "SECURITIES ISSUED"

BANK_LOANS_NPL:
  ALL:
    # single generic words ("lancar", "current", "loss") are left out: they match every
    # page with current assets / current accounts / profit or loss
    terms_id:
      - "kredit yang diberikan"
      - "pinjaman yang diberikan"
      - "kolektibilitas"
      - "dalam perhatian khusus"
      - "kurang lancar"
      - "diragukan"
      - "macet"
      - "kredit bermasalah"
      - "cadangan kerugian penurunan nilai"
      - "CKPN"
    terms_en:
      - "loans"
      - "collectibility"
      - "collectability"
      - "special mention"
      - "substandard"
      - "doubtful"
      - "non-performing loans"
      - "allowance for impairment losses"
      - "stage 3"
    # loan quality spans the loans note (collectibility, stage, CKPN movement) plus the
    # credit-risk note (e.g. BMRI 2025: 7 pages); 6 pages cannot cover both
    max_pages: 12
    anchor_patterns:
      - "KREDIT YANG DIBERIKAN"
      - "PINJAMAN YANG DIBERIKAN"
      - "KUALITAS ASET"
      - "KUALITAS KREDIT"
      - "CREDIT QUALITY"
      - "LOANS AND ADVANCES"

PLANTATION_AREA:
